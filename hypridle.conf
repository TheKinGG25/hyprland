# hypridle: locks the screen before sleep. No idle timers on purpose (lock only by hand or before sleep).
# The lock screen is Quickshell's (~/.config/quickshell/LockScreen.qml), reached over its IPC.
general {
    lock_cmd = qs ipc call lock lock          # on `loginctl lock-session`
    before_sleep_cmd = loginctl lock-session  # lock before suspend, so the screen is locked on wake
    inhibit_sleep = 3                         # hold off sleep until the lock screen is actually up
    # After wake the screens can stay frozen on the last frame (or black), so the lock screen
    # never shows the typed dots. Turning them off and on again makes Hyprland redraw them.
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "off"})' && sleep 0.2 && hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}
